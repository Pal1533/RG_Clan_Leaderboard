name: Bug report
description: Something on the Clan Clash board is wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, do not use this form — see [SECURITY.md](https://github.com/Pal1533/RG_Clan_Leaderboard/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Standings
        - Clan / members
        - Archive
        - Admin
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 128, Firefox 141, …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://pal1533.github.io/RG_Clan_Leaderboard/
